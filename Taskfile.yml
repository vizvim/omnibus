version: "3"

env:
  # Local-dev defaults: keep runtime data in ./.dev (not the container's /data),
  # colorized human-readable logs at debug level. Override any of these in your shell.
  # Secrets stay env-only: export OMNIBUS_COMICVINE_API_KEY in your shell — it
  # is inherited here and never written to the Taskfile.
  OMNIBUS_HTTP_ADDR: ":8080"
  OMNIBUS_DB_PATH: .dev/omnibus.db
  OMNIBUS_DATA_PATH: .dev
  # Keep the organized library under ./.dev too. The production default is
  # /comics (a mounted volume in Docker), which is not writable in local dev —
  # without this, post-process import fails with "create library dir: permission
  # denied" and River retries the PostProcess job forever.
  OMNIBUS_LIBRARY_PATH: .dev/library
  OMNIBUS_LOG_LEVEL: debug
  # console = the colorized, human-friendly slog handler (zerolog-style) for local dev.
  OMNIBUS_LOG_FORMAT: console

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  dev:
    desc: Run backend + Vite frontend together with sane local defaults (the friendly one)
    deps:
      - dev:backend
      - dev:frontend

  dev:backend:
    desc: Run the Go server with local-friendly defaults (colorized console logs, ./.dev data dir)
    cmds:
      - mkdir -p .dev
      - go run ./cmd/omnibus

  dev:frontend:
    desc: Run the Vite dev server (proxies /api + /covers to the backend on :8080)
    dir: frontend
    cmds:
      - npm run dev

  proto-generate:
    desc: Lint protos and regenerate Go + TS Connect clients via buf v2
    cmds:
      - buf lint
      - buf generate

  sqlc-generate:
    desc: Generate type-safe Go from SQL (sqlc). No-op until sqlc.yaml exists (lands in 02-02).
    cmds:
      - |
        if [ -f sqlc.yaml ]; then
          sqlc generate
        else
          echo "sqlc.yaml not present yet — skipping sqlc generate"
        fi

  generate:
    desc: Run all code generation (proto clients + sqlc query code)
    cmds:
      - task: proto-generate
      - task: sqlc-generate

  build:
    desc: Build the Go backend and the frontend bundle
    cmds:
      - go build ./...
      - cd frontend && npm run build

  test:go:
    desc: Run the Go test suite
    cmds:
      - go test ./... -count=1

  test:web:
    desc: Run the frontend (vitest) test suite
    cmds:
      - cd frontend && npm run test

  test:
    desc: Run the full test suite (Go + frontend)
    cmds:
      - task: test:go
      - task: test:web

  lint:
    desc: Lint Go (golangci-lint) and protos (buf lint)
    cmds:
      - golangci-lint run
      - buf lint

  docker:
    desc: Build the Docker image (stub — full multi-stage Dockerfile lands in Phase 7 / OPS-03)
    cmds:
      - echo "docker target is a Phase 2 stub; multi-stage Dockerfile is delivered in Phase 7 (OPS-03)"
