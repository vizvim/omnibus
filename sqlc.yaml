version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/db/migrations"
    queries: "internal/repository/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/repository/sqlc"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: false
        emit_empty_slices: true
